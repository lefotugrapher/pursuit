<!DOCTYPE html>
<!--
  Fixture modelled on apply.workable.com/{account}/j/{shortcode}/apply/ (Nov 2026). Field ids, labels,
  section names and texts come from the live public form schema
  (apply.workable.com/api/v1/jobs/{shortcode}/form) and the candidate app bundle: client-rendered
  form[data-ui="application-form"]; sections "Personal information" / "Profile" / "Details"; resume
  dropzone ("Choose file" / "or drag and drop here"); boolean questions as Yes/No radios; the required
  GDPR checkbox and the optional SMS-contact consent; cookie banner with data-ui cookie-consent-accept /
  cookie-consent-decline ("Accept all" / "Decline all"); button[data-ui="apply-button"] "Submit
  application"; success "Thank you!" + "Your application has been submitted successfully.". Also an
  invisible reCAPTCHA badge (passive, must not block). Variants (?variant=): captcha (visible reCAPTCHA
  checkbox), account (sign-in wall), extra (an extra required attestation-style question).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PR Executive - Acme Comms</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  [data-ui="cookie-consent"] { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #999; padding: 12px; z-index: 50; }
  .field { margin: 12px 0; }
  .dropzone { border: 1px dashed #888; padding: 12px; position: relative; }
  .dropzone input[type=file] { position: absolute; inset: 0; opacity: 0; }
  .grecaptcha-badge { width: 256px; height: 60px; position: fixed; bottom: 14px; right: -186px; }
  .err { color: #b00; }
</style>
<script src="/_harness.js"></script>
</head>
<body>
<div id="app"><div class="loader">Loading</div></div>
<div class="grecaptcha-badge" data-style="bottomright"><iframe title="reCAPTCHA" src="about:blank" width="256" height="60" frameborder="0"></iframe></div>
<div data-ui="cookie-consent" role="dialog" aria-label="Cookie Consent">
  <span>This website uses cookies to improve user’s experience, personalise ads and analyse traffic. You can accept all cookies, decline all optional cookies, or manage your cookie settings.</span>
  <button data-ui="cookie-consent-accept">Accept all</button>
  <button data-ui="cookie-consent-decline">Decline all</button>
  <button data-ui="cookie-consent-settings">Cookies settings</button>
</div>

<script>
(function () {
  var variant = (/[?&]variant=([a-z]+)/.exec(location.search) || [])[1] || '';
  var app = document.getElementById('app');
  document.querySelector('[data-ui="cookie-consent-accept"]').addEventListener('click', function () { document.querySelector('[data-ui="cookie-consent"]').remove(); window.__send('workable-cookies', { choice: 'accept' }); });
  document.querySelector('[data-ui="cookie-consent-decline"]').addEventListener('click', function () { document.querySelector('[data-ui="cookie-consent"]').remove(); window.__send('workable-cookies', { choice: 'decline' }); });

  if (variant === 'account') {
    app.innerHTML = '<h1>Sign in to continue</h1><p>Please sign in to apply. New user? Create an account.</p>' +
      '<form><label>Email <input type="email" name="email"></label> <label>Password <input type="password" name="password"></label>' +
      ' <label>Confirm password <input type="password" name="password2"></label> <button type="submit">Create account</button></form>';
    return;
  }

  function radios(name, label, required) {
    return '<fieldset class="field" data-ui="' + name + '" role="radiogroup" aria-labelledby="' + name + '_label"><legend id="' + name + '_label">' + label + (required ? '<strong>*</strong>' : '') + '</legend>' +
      '<label><input type="radio" name="' + name + '" value="true"' + (required ? ' required' : '') + '> <span>Yes</span></label> ' +
      '<label><input type="radio" name="' + name + '" value="false"> <span>No</span></label></fieldset>';
  }
  function text(id, label, required, type) {
    return '<div class="field"><label for="' + id + '">' + label + (required ? '<strong>*</strong>' : '') + '</label>' +
      '<input id="' + id + '" name="' + id + '" data-ui="' + id + '" type="' + (type || 'text') + '"' + (required ? ' aria-required="true"' : '') + '></div>';
  }

  function render() {
    app.innerHTML =
      '<h1 data-ui="job-title">PR Executive</h1>' +
      '<form data-ui="application-form" novalidate>' +
      '<section data-ui="section"><h3>Personal information</h3>' +
        text('firstname', 'First name', true) + text('lastname', 'Last name', true) + text('email', 'Email', true, 'email') +
        '<div class="field"><label for="phone">Phone</label><div class="phone"><button type="button" aria-haspopup="listbox" aria-label="Select country: Ireland">IE +353</button>' +
        '<input id="phone" name="phone" data-ui="phone" type="tel"></div><p class="helper">The hiring team may use this number to contact you about this job.</p></div>' +
      '</section>' +
      '<section data-ui="section"><h3>Profile</h3>' +
        '<div class="field" data-ui="education"><span>Education</span> <button type="button" data-ui="add-section">+ Add</button></div>' +
        '<div class="field" data-ui="experience"><span>Experience</span> <button type="button" data-ui="add-section">+ Add</button></div>' +
        '<div class="field"><label for="resume">Resume<strong>*</strong></label><div class="dropzone"><input id="resume" name="resume" data-ui="resume" type="file" accept=".pdf,.doc,.docx,.odt,.rtf" aria-required="true">' +
        '<span>Choose file</span> <span>or drag and drop here</span><span class="fname"></span></div></div>' +
      '</section>' +
      '<section data-ui="section"><h3>Details</h3>' +
        '<div class="field"><label for="cover_letter">Cover letter</label><textarea id="cover_letter" name="cover_letter" data-ui="cover_letter" rows="6"></textarea></div>' +
        radios('CA_10628', 'Are you eligible to work in the country you are applying?', true) +
        text('CA_10629', 'How did you hear about us?', false) +
        (variant === 'extra' ? radios('QA_11844074', 'Can you confirm that everything in this application is true and your own, including your experience and identity?', true) : '') +
        (variant === 'captcha' ? '<div class="g-recaptcha" data-sitekey="6LcTEST"><iframe title="reCAPTCHA" src="about:blank" width="304" height="78"></iframe></div>' : '') +
        '<div class="field"><label><input type="checkbox" name="gdpr" data-ui="gdpr" required> I have read, understand and accept the content of the <a href="#" target="_blank">Privacy Notice</a> and consent to the processing of my data as part of this application.</label></div>' +
        '<div class="field"><label><input type="checkbox" name="sms" data-ui="sms"> I consent to the hiring team of this job contacting me via text message.</label></div>' +
      '</section>' +
      '<p class="err" role="alert" id="form-error" hidden></p>' +
      '<button type="submit" data-ui="apply-button">Submit application</button>' +
      '</form>';
    var form = app.querySelector('form');
    form.querySelector('#resume').addEventListener('change', function () { form.querySelector('.fname').textContent = this.files.length ? this.files[0].name : ''; });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var bad = [];
      ['firstname', 'lastname', 'email'].forEach(function (id) { if (!form.querySelector('#' + id).value.trim()) bad.push(id); });
      if (!form.querySelector('#resume').files.length) bad.push('resume');
      if (!form.querySelector('input[name="CA_10628"]:checked')) bad.push('CA_10628');
      if (variant === 'extra' && !form.querySelector('input[name="QA_11844074"]:checked')) bad.push('QA_11844074');
      if (!form.querySelector('input[name="gdpr"]').checked) bad.push('Please accept the Privacy Notice to continue.');
      var err = form.querySelector('#form-error');
      if (bad.length) { err.hidden = false; err.textContent = 'This is a required field: ' + bad.join(', '); return; }
      window.__send('workable', window.__collect(form)).then(function () {
        app.innerHTML = '<div><h2>Thank you!</h2><p>Your application has been submitted successfully.</p></div>';
      });
    });
  }
  setTimeout(render, 300);
})();
</script>
</body>
</html>
